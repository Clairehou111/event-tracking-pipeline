# Simulates DataWorks (Kafka consumer + ETL + write to warehouse)

# INPUT — consume from Kafka (same as DataWorks data source config)
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["EVENT_TRACKING_LOG_COLLECTOR"]
    group_id          => "logstash-etl-consumer"
    codec             => "json"
    auto_offset_reset => "earliest"
  }
}

# FILTER — ETL / parse fields (same as DataWorks cleaning job)
filter {

  # Parse datetime into partition fields
  # DataWorks does this automatically when writing to ODPS partitions
  date {
    match   => ["dateTime", "yyyy-MM-dd HH:mm:ss"]
    target  => "parsed_date"
  }



  # Serialize data map to JSON string (how ODPS stores it)
  # Serialize data map to JSON string AND extract partition fields
  ruby {
    code => "
      # 1. Serialize data field to JSON string
      data_field = event.get('data')
      if data_field
        require 'json'
        event.set('data_str', data_field.to_json)
      end

      # 2. Extract Year, Month, Day, Hour for ClickHouse partitions
      parsed_date = event.get('parsed_date')
      if parsed_date
        # Convert Logstash Timestamp to Ruby Time object
        t = parsed_date.time
        event.set('year', t.strftime('%Y'))
        event.set('month', t.strftime('%m'))
        event.set('day', t.strftime('%d'))
        event.set('hour', t.strftime('%H'))
      end
    "
  }

  # Clean up Filebeat metadata fields
  mutate {
    remove_field => ["@version", "@timestamp", "parsed_date",
                     "agent", "host", "input", "log", "ecs"]
  }
}

# OUTPUT — write to ClickHouse (same as DataWorks writing to ODPS)
output {

  # Debug — see every message in Logstash logs
  stdout {
    codec => rubydebug
  }

  # Write to ClickHouse raw table
  # Mirrors: my_event_tracking.event_tracking_log_rt
  http {
    url     => "http://clickhouse:8123/?query=INSERT%20INTO%20my_event_tracking.event_tracking_log_rt%20FORMAT%20JSONEachRow"
    http_method => "post"
    headers => {
      "X-ClickHouse-User"     => "default"
      "X-ClickHouse-Key"      => ""
      "Content-Type"          => "application/json"
    }
    format  => "json"
    mapping => {
      "namespace"  => "%{namespace}"
      "sceneKey"   => "%{sceneKey}"
      "sceneDesc"  => "%{sceneDesc}"
      "dateTime"   => "%{dateTime}"
      "timestamp"  => "%{timestamp}"
      "traceId"    => "%{traceId}"
      "spanId"     => "%{spanId}"
      "data"       => "%{data_str}"
      "message"    => "%{message}"
      "year"       => "%{year}"
      "month"      => "%{month}"
      "day"        => "%{day}"
      "hour"       => "%{hour}"
    }
  }
}
